name: Android APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ikonok, felület és beállítások bemásolása
        run: |
          pip install pillow
          python make_icon.py
          mkdir -p android/app/src/main/assets
          cp app_ui.html config.json android/app/src/main/assets/
          base64 -d android/app/release.keystore.b64 > android/app/release.keystore

      - name: APK fordítása
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Feltöltés az "android" kiadásba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk VintedFigyelo.apk
          gh release delete android --yes --cleanup-tag || true
          gh release create android VintedFigyelo.apk --title "Vinted IT-figyelő (Android)" --notes "Töltsd le a VintedFigyelo.apk-t a telefonodra, és telepítsd (engedélyezd az ismeretlen forrásból való telepítést). Build: ${{ github.sha }}"
