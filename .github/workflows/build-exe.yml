name: Windows app build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Csomagok telepítése
        run: |
          pip install pyinstaller pywebview pillow
          python make_icon.py

      - name: App fordítása
        run: pyinstaller --onedir --windowed --noconfirm --name VintedFigyelo --icon app.ico --add-data "app_ui.html;." --collect-all webview app.py

      - name: Önteszt a kész .exe-vel
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/VintedFigyelo/VintedFigyelo.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Az önteszt elbukott (kilépési kód: $($p.ExitCode))" }

      - name: ZIP összeállítása
        shell: pwsh
        run: |
          Copy-Item config.json, README.md dist/VintedFigyelo/
          Compress-Archive -Path dist/VintedFigyelo -DestinationPath VintedFigyelo-windows.zip -Force

      - name: Feltöltés a "latest" kiadásba
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest VintedFigyelo-windows.zip --title "Vinted IT-figyelő (Windows app)" --notes "Csomagold ki, és indítsd el a VintedFigyelo.exe-t. Python nem kell hozzá. Build: ${{ github.sha }}"
